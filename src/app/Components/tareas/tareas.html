<br>
<h3>Listado de Tareas</h3>
<div style="width:75%">
    <table class="table table-bordered table-striped">
        <thead>
            <tr class="filters">
                <th>id</th>
                <th>nombre</th>
                <th>estado
                    <select class="form-select" (change)="onCambioFiltro($any($event.target)?.value)">
                        <option value="Todas">Todas</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Realizada">Realizada</option>
                    </select>
                </th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let tarea of tareasFiltradas">
                <td>{{ tarea.id }}</td>
                <td>{{ tarea.nombre }}</td>
                <td>{{ tarea.estado }}</td>
                <td>
                    <button class="btn btn-danger" [disabled]="tarea.estado === 'Realizada'" (click)="finalizar(tarea.id)">Finalizar</button>
                    &nbsp;
                    <button class="btn btn-primary" (click)="eliminar(tarea.id)">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <h4>Total Pendientes: {{ totalPendientes }} </h4>
    <h4>Total Realizadas: {{ totalRealizadas }} </h4>

</div>
