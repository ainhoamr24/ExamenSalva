<br>
<h3 class="text-center"> Fin de la Tarea {{ tarea?.id }} </h3>
<div class="alert alert-dark text-center" role="alert" *ngIf="tarea">
    <h4> {{ tarea.nombre }}  </h4>
    <div class="text-center">
        <button class="btn btn-danger" (click)="finalizar()">Finalizar</button> &nbsp;
        <button class="btn btn-primary" (click)="cancelar()">Cancelar</button>
    </div>
</div>
